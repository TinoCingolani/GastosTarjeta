name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los martes y viernes a las 00:00 UTC
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petición a la base de datos
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/meses?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
