name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los martes y viernes a las 00:00 UTC
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Permite probarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petición a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Limpiar saltos de línea, retornos de carro, comillas y espacios accidentales
          CLEAN_URL=$(echo -n "$SUPABASE_URL" | tr -d '\r\n"' | sed "s/^[ ']*//;s/[ ']*$//")
          CLEAN_KEY=$(echo -n "$SUPABASE_KEY" | tr -d '\r\n"' | sed "s/^[ ']*//;s/[ ']*$//")
          
          # Asegurar que comience con https://
          if [[ "$CLEAN_URL" != http*://* ]]; then
            CLEAN_URL="https://$CLEAN_URL"
          fi
          
          # Quitar barra final si la tiene
          CLEAN_URL="${CLEAN_URL%/}"

          echo "Enviando ping a Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$CLEAN_URL/rest/v1/meses?select=id&limit=1" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY")

          echo "Código HTTP recibido: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping exitoso. Supabase permanece activo."
          else
            echo "Error: la petición devolvió código HTTP $HTTP_STATUS"
            exit 1
          fi
