name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los martes y viernes a las 00:00 UTC
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Permite probarlo manualmente desde GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petición a la base de datos
        run: |
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          URL=$(echo "$RAW_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'"'"']//' -e 's/["'"'"']$//')
          
          if [[ "$URL" != http*://* ]]; then
            URL="https://$URL"
          fi
          
          URL="${URL%/}"

          echo "Enviando ping a Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$URL/rest/v1/meses?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")

          echo "Código de respuesta HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping exitoso. Supabase permanece activo."
          else
            echo "Error: la petición devolvió código $HTTP_STATUS"
            exit 1
          fi
